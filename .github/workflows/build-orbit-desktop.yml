name: Build Orbit Desktop

on:
  workflow_dispatch:
  push:
    tags:
      - "orbit-v*"

jobs:
  package:
    name: ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: Windows x64
            command: build:win
            artifact: orbit-windows
          - os: macos-latest
            label: macOS x64 and arm64
            command: build:mac
            artifact: orbit-macos
          - os: ubuntu-latest
            label: Linux x64
            command: build:linux
            artifact: orbit-linux
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: orbit
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: orbit/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm run ${{ matrix.command }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: orbit/release/**
          if-no-files-found: error
