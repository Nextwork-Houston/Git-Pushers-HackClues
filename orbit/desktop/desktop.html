<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Orbit Desktop Companion</title>
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: transparent; }
    body { font-family: Inter, "Segoe UI", sans-serif; user-select: none; }
    .desktop-shell { position: relative; width: 100%; height: 100%; }
    avatar-companion {
      --avatar-aura-opacity: .9;
      --avatar-aura-size: 264px;
      --avatar-aura-bottom: 2px;
      --avatar-aura-border: 1px solid rgba(72, 245, 255, .48);
      --avatar-aura-shadow: 0 0 12px rgba(32, 246, 255, .58), inset 0 0 22px rgba(22, 119, 255, .2);
      --avatar-outline-glow: drop-shadow(0 0 4px rgba(32, 246, 255, .9)) drop-shadow(0 0 12px rgba(22, 119, 255, .58));
      position: absolute;
      right: 0;
      bottom: 0;
    }
    .desktop-shell[data-dragging="true"] { cursor: grabbing; }
  </style>
</head>
<body>
  <main class="desktop-shell">
    <avatar-companion
      id="orbit"
      desktop
      sprite-src="../orbit-spritesheet.png"
      emotions-src="../orbit-actions-emotions.png"
      acrobatics-src="../orbit-actions-acrobatics.png"
      entertainment-src="../orbit-actions-entertainment.png"
      love-src="../orbit-actions-love.png"
      skin-storage-key="orbit-desktop-skin"
      state="idle">
    </avatar-companion>
  </main>
  <script src="../avatar-companion.js"></script>
  <script src="./desktop.js"></script>
</body>
</html>
